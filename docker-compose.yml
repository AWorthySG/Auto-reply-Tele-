# Usage:
#   1. Create .env (API creds) and your config:
#        cp .env.example .env                 # then edit API id/hash
#        cp config.example.yaml config.yaml   # then edit your rules
#   2. Log in ONCE (interactive) to create the session in the data volume:
#        docker compose run --rm autoreply python login.py
#   3. Start the bot:
#        docker compose up -d
#   4. Logs: docker compose logs -f
#
# Session + state persist in the named volume "autoreply-data" (writable by the
# container's non-root user). config.yaml is bind-mounted read-only so you can
# edit it on the host.

services:
  autoreply:
    build: .
    restart: unless-stopped
    env_file: ./.env
    # Force the data paths under the named volume, regardless of what .env says
    # (compose `environment` overrides `env_file`).
    environment:
      SESSION_NAME: /data/autoreply
      STATE_PATH: /data/state.json
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - autoreply-data:/data

volumes:
  autoreply-data:
